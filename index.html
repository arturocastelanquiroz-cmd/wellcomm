<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WellCOMM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:0;padding-bottom:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>WellCOMM</title>
<meta name="theme-color" content="#0A211F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: escenario oscuro con panel de demo a la izquierda y un teléfono a la derecha; en móvil la app ocupa toda la pantalla. */
:root{
  --pine:#0A211F;      /* fondo app */
  --ink:#061412;       /* escenario y marco */
  --surface:#123430;   /* tarjetas */
  --surface-2:#173f3a; /* tarjeta elevada / input */
  --leaf:#2A4E45;      /* bordes, superficies secundarias */
  --spark:#D8FF85;     /* acción principal */
  --mint:#8DFDBA;      /* estados, acentos secundarios */
  --text:#EEF6EF;
  --muted:#9CB8AE;
  --faint:#6E8C83;
  --alert:#FF9944;     /* solo pánico / alertas (Orangeade de la marca) */
  --on-light:#0A211F;
  --f-display:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-lg:26px; --r-md:18px; --r-pill:999px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-display);font-size:15px;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--spark);outline-offset:2px}
.mono{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.14em;font-size:11px}

/* ---------- Escenario ---------- */
.stage{min-height:100%;display:flex;gap:56px;align-items:center;justify-content:center;padding-block:24px;max-width:1180px;margin:0 auto}
.panel{width:380px;flex:none;display:flex;flex-direction:column;gap:22px;max-height:calc(100vh - 48px);overflow:auto;padding-right:6px}
.panel::-webkit-scrollbar{width:6px}.panel::-webkit-scrollbar-thumb{background:var(--leaf);border-radius:6px}
.wordmark{font-size:40px;line-height:1;letter-spacing:-.02em;color:var(--text)}
.wordmark i{font-family:var(--f-serif);font-weight:400;font-style:italic;color:var(--spark)}
.wordmark b{font-weight:700}
.panel h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
.panel p{color:var(--muted);line-height:1.5;margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--pine);border:1px solid var(--leaf);border-radius:16px;padding:4px;gap:4px}
.seg button{border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.seg button span{font-weight:700;font-size:14px}
.seg button small{color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--spark);color:var(--on-light)}
.seg button[aria-pressed="true"] small{color:#2A4E45}
.idx{display:flex;flex-direction:column;gap:14px}
.idx h3{margin:0 0 6px;color:var(--faint)}
.idx ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.idx a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text);font-size:13px;padding:6px 10px;border:1px solid var(--leaf);border-radius:var(--r-pill)}
.idx a:hover{border-color:var(--mint)}
.idx a.on{background:var(--surface-2);border-color:var(--mint)}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.legend div{display:flex;gap:10px;align-items:center}
.credit{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--faint);border-top:1px solid var(--leaf);padding-top:16px}
.random{background:#111111;color:#D4FC5C;font-family:var(--f-mono);font-weight:600;letter-spacing:.12em;font-size:11px;padding:5px 8px;border-radius:4px;border:1px solid #2b2b2b}

/* ---------- Dispositivo ---------- */
.device{position:relative;width:390px;height:min(844px,calc(100vh - 48px));flex:none;border-radius:54px;background:var(--pine);
  border:10px solid #030b0a;box-shadow:0 0 0 1px #24433c,0 40px 80px -30px #000;overflow:hidden}
.statusbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;font-size:14px;font-weight:600;z-index:6;pointer-events:none}
.statusbar .notch{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#030b0a}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:58px 22px 120px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.nonav{padding-bottom:40px}
.mobilebar{display:none}

@media (max-width:860px){
  body{padding-left:0;padding-right:0}
  .stage{display:block;padding:0;max-width:none;height:100%}
  .panel{display:none}
  .panel.open{display:flex;position:fixed;inset:0;z-index:50;background:var(--ink);max-height:none;width:auto;
    padding:calc(56px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px))}
  .device{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .statusbar{display:none}
  .screen{padding-top:calc(52px + env(safe-area-inset-top,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  .mobilebar{display:flex;position:fixed;top:0;left:0;right:0;z-index:60;height:calc(36px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));
    align-items:center;justify-content:space-between;background:#04100e;border-bottom:1px solid var(--leaf)}
  .mobilebar button{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--spark);padding:6px 0}
}

/* ---------- Componentes de la app ---------- */
.hdr{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.back{width:48px;height:48px;border-radius:50%;border:1px solid var(--leaf);background:var(--surface);display:grid;place-items:center;flex:none}
.hdr .eyebrow{color:var(--muted)}
.hdr h2{margin:2px 0 0;font-size:26px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.hdr .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;font-weight:600;text-transform:uppercase;padding:3px 7px;border-radius:5px;white-space:nowrap}
.tag.p{color:var(--mint);border:1px solid #3d7d63;background:#0f2e27}
.tag.w{color:var(--on-light);background:var(--spark)}
.tag.f{color:var(--muted);border:1px dashed var(--faint)}
.tag.dot::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.lbl{color:var(--muted);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.lbl a,.lbl button{color:var(--spark);text-decoration:none;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 18px;border-radius:var(--r-pill);border:1px solid var(--leaf);font-weight:600;font-size:15px;background:transparent}
.chip[aria-pressed="true"]{background:var(--text);color:var(--on-light);border-color:var(--text)}
.cta{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;padding:19px;border-radius:20px;background:var(--spark);color:var(--on-light);
  font-family:var(--f-mono);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:14px;margin-top:22px}
.cta.ghost{background:transparent;color:var(--text);border:1px solid var(--leaf)}
.cta.alert{background:var(--alert)}
.cta:active{transform:scale(.99)}
.field{width:100%;background:var(--surface);border:1px solid var(--leaf);border-radius:var(--r-md);padding:16px 18px;font-size:16px;outline:none}
.field:focus{border-color:var(--mint)}
textarea.field{min-height:90px;resize:none;line-height:1.45}
.card{background:var(--surface);border:1px solid var(--leaf);border-radius:var(--r-lg);padding:18px}
.row{display:flex;align-items:center;gap:14px}
.rows{border-top:1px solid var(--leaf)}
.rows>*{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--leaf);width:100%;text-align:left}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--mint)}
.ico.light{background:var(--text);color:var(--on-light)}
.grow{flex:1;min-width:0}
.t1{font-weight:700;font-size:16px}
.t2{color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.4}
.badge{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border:1px solid var(--leaf);border-radius:7px;color:var(--muted);white-space:nowrap}
.badge.mint{color:var(--mint);border-color:#3d7d63}
.badge.spark{color:var(--on-light);background:var(--spark);border-color:var(--spark)}
.badge.alert{color:var(--alert);border-color:#7a4a25}
.note{display:flex;gap:10px;color:var(--muted);font-size:13.5px;line-height:1.5;margin-top:16px}
.note::before{content:"//";color:var(--mint);font-family:var(--f-mono);flex:none}
.note.warn::before{color:var(--alert)}
.switch{width:52px;height:30px;border-radius:30px;background:var(--leaf);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--text);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--mint)}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--pine)}
.switch[disabled]{opacity:.55}

/* Inicio */
.home-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.home-top .place{color:var(--muted)}
.home-top h2{margin:3px 0 0;font-size:24px;white-space:nowrap;font-weight:700;display:flex;align-items:center;gap:6px}
.roundbtn{width:52px;height:52px;border-radius:50%;border:1px solid var(--leaf);background:var(--surface);display:grid;place-items:center;position:relative}
.roundbtn .pip{position:absolute;top:13px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--alert);border:2px solid var(--surface)}
.sosbtn{height:52px;padding:0 22px;border-radius:var(--r-pill);background:var(--alert);color:var(--on-light);font-family:var(--f-mono);font-weight:600;letter-spacing:.16em}
.greet{font-size:27px;line-height:1.18;font-weight:600;letter-spacing:-.015em;margin:14px 0 12px;text-wrap:pretty}
.greet a{color:var(--spark);text-decoration:none;border-bottom:2px dotted var(--spark)}
.greet .soft{color:var(--muted)}
.live{display:flex;gap:16px;flex-wrap:wrap;color:var(--text);font-size:10.5px}
.live span:first-child::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint);margin-right:8px;vertical-align:1px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.tile{position:relative;aspect-ratio:1/0.88;border-radius:var(--r-lg);border:1px solid var(--leaf);background:var(--surface);padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.tile .n{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tile b{font-size:21px;line-height:1.05;font-weight:800;letter-spacing:-.01em}
.tile.s{background:var(--spark);border-color:var(--spark);color:var(--on-light)}
.tile.s .n,.tile.m .n{color:#2A4E45}
.tile.m{background:var(--mint);border-color:var(--mint);color:var(--on-light)}
.tile .tag{position:absolute;bottom:14px;right:14px}
.tile.s .tag.w{background:var(--pine);color:var(--spark)}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:0 22px}
.strip::-webkit-scrollbar{display:none}
.mini{flex:none;width:138px;border-radius:20px;border:1px dashed var(--leaf);padding:14px;text-align:left;display:flex;flex-direction:column;gap:22px;color:var(--muted)}
.mini b{color:var(--text);font-size:15px;line-height:1.15}
.feed>*{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--leaf);width:100%;text-align:left;align-items:center}
.feed time{font-family:var(--f-mono);font-size:13px;width:44px;flex:none}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Nav inferior */
.nav{position:absolute;left:14px;right:14px;bottom:14px;height:76px;border-radius:40px;background:#0d2a26;border:1px solid var(--leaf);display:flex;align-items:center;justify-content:space-between;padding:0 8px;z-index:5}
@media (max-width:860px){.nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px))}}
.nav::before{content:"";position:absolute;left:-20px;right:-20px;bottom:-20px;height:130px;background:linear-gradient(to top,var(--pine) 55%,rgba(10,33,31,0));z-index:-1;pointer-events:none}
.nav button{height:60px;min-width:60px;border-radius:32px;display:flex;align-items:center;justify-content:center;gap:9px;color:var(--muted);font-weight:700;flex:1}
.nav button span{display:none}
.nav button.on{background:var(--spark);color:var(--on-light);flex:2.2}
.nav button.on span{display:inline}

/* Notificaciones */
.ntf{display:flex;flex-direction:column;gap:10px}
.ntf>*{display:flex;gap:14px;padding:16px 18px;border-radius:22px;background:var(--surface);border:1px solid var(--leaf);text-align:left;width:100%}
.ntf .d{width:9px;height:9px;border-radius:50%;background:var(--faint);margin-top:6px;flex:none}
.ntf .hot{border-color:var(--alert)}.ntf .hot .d{background:var(--alert)}
.ntf .new .d{background:var(--mint)}
.ntf time{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);flex:none}

/* SOS */
.sos-wrap{display:flex;flex-direction:column;align-items:center;text-align:center}
.sos-copy{color:var(--muted);font-size:18px;line-height:1.4;margin:26px 10px 20px}
.sos-copy b{color:var(--text)}
.sos-frame{position:relative;width:300px;height:300px;display:grid;place-items:center;max-width:100%}
.sos-frame i{position:absolute;width:30px;height:30px;border-color:var(--faint);border-style:solid;border-width:0}
.sos-frame i:nth-child(1){top:0;left:0;border-top-width:1.5px;border-left-width:1.5px}
.sos-frame i:nth-child(2){top:0;right:0;border-top-width:1.5px;border-right-width:1.5px}
.sos-frame i:nth-child(3){bottom:0;left:0;border-bottom-width:1.5px;border-left-width:1.5px}
.sos-frame i:nth-child(4){bottom:0;right:0;border-bottom-width:1.5px;border-right-width:1.5px}
.hold{--p:0;width:236px;height:236px;border-radius:50%;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;
  background:conic-gradient(var(--text) calc(var(--p)*1turn),#3a2a1d 0);padding:14px;box-shadow:0 0 0 18px #1a1c14}
.hold .core{width:100%;height:100%;border-radius:50%;background:var(--alert);color:var(--on-light);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.hold .core b{font-size:72px;font-weight:800;letter-spacing:-.03em;line-height:.9}
.hold.key{background:conic-gradient(var(--pine) calc(var(--p)*1turn),#2c4a2c 0);box-shadow:0 0 0 18px #12302c}
.hold.key .core{background:var(--spark)}
.hold.key .core b{font-size:22px;letter-spacing:.02em}
.kv{width:100%;margin-top:24px}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--leaf);font-family:var(--f-mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.kv>div:last-child{border-bottom:1px solid var(--leaf)}
.kv>div span:first-child{color:var(--muted);white-space:nowrap}
.kv>div span:last-child{text-align:right}
.count{font-size:110px;font-weight:800;line-height:1;color:var(--alert);margin:20px 0 6px;font-variant-numeric:tabular-nums}
.steps{display:flex;flex-direction:column;width:100%;text-align:left;margin-top:8px}
.steps>div{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--leaf);opacity:.35;transition:opacity .4s}
.steps>div.done{opacity:1}
.steps .ck{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;margin-top:1px}
.steps .done .ck{background:var(--mint);border-color:var(--mint);color:var(--on-light)}
.attended{width:100%;border:1px solid var(--mint);background:#0f2e27;border-radius:22px;padding:16px;text-align:left;margin-top:14px}

/* Ticket */
.photo{display:flex;align-items:center;justify-content:center;gap:10px;height:120px;border:1.5px dashed var(--leaf);border-radius:var(--r-md);color:var(--muted);cursor:pointer;overflow:hidden;position:relative}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tracker{display:flex;flex-direction:column;margin-top:6px}
.tracker>div{display:flex;gap:14px;position:relative;padding-bottom:22px}
.tracker>div:last-child{padding-bottom:0}
.tracker>div::before{content:"";position:absolute;left:12px;top:28px;bottom:2px;width:2px;background:var(--leaf)}
.tracker>div:last-child::before{display:none}
.tracker>div.done::before{background:var(--mint)}
.tracker .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--leaf);display:grid;place-items:center;flex:none;background:var(--pine);z-index:1}
.tracker .done .ck{background:var(--mint);border-color:var(--mint);color:var(--on-light)}
.tracker .cur .ck{border-color:var(--spark);box-shadow:0 0 0 4px #2b3a1c}
.stars{display:flex;gap:6px}
.stars button{color:var(--leaf)}
.stars button.on{color:var(--spark)}

/* Pase QR */
.pass{background:var(--text);color:var(--on-light);border-radius:28px;padding:22px;position:relative}
.pass .mono{color:#2A4E45}
.pass canvas{display:block;width:100%;max-width:220px;aspect-ratio:1;margin:16px auto;image-rendering:pixelated}
.pass .cut{border-top:2px dashed #b9cbbf;margin:16px -22px;position:relative}
.pass .cut::before,.pass .cut::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--pine)}
.pass .cut::before{left:-12px}.pass .cut::after{right:-12px}
.big-code{font-size:56px;font-weight:800;letter-spacing:.08em;font-variant-numeric:tabular-nums;line-height:1}

/* Hero de alta */
.brandline{display:flex;justify-content:space-between;align-items:center}
.alta-h{font-size:46px;line-height:.98;font-weight:800;letter-spacing:-.03em;text-transform:uppercase;margin:16px 0 26px}
.alta-h span{color:#4f6f66}
.idcard{position:relative;border:1px solid var(--leaf);background:var(--surface);border-radius:var(--r-lg);padding:24px 22px}
.idcard .corner{position:absolute;width:20px;height:20px;border-color:var(--muted);border-style:solid;border-width:0}
.idcard .c1{top:12px;left:12px;border-top-width:1.5px;border-left-width:1.5px}
.idcard .c2{top:12px;right:12px;border-top-width:1.5px;border-right-width:1.5px}
.room{font-size:78px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:10px 0 14px;display:flex;justify-content:space-between;align-items:flex-end}
.symbol{display:flex;gap:3px;align-items:flex-end}
.symbol i{display:block;width:9px;border-radius:9px;background:var(--mint)}

/* Comunidad */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cgrid button{border:1px solid var(--leaf);background:var(--surface);border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:20px;min-height:132px}
.cgrid button .ico{width:40px;height:40px;border-radius:12px}
.cgrid b{font-size:16px;line-height:1.15}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slots button{padding:12px 0;border-radius:14px;border:1px solid var(--leaf);font-family:var(--f-mono);font-size:12.5px}
.slots button[aria-pressed="true"]{background:var(--spark);color:var(--on-light);border-color:var(--spark)}
.slots button:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.post{padding:16px 0;border-top:1px solid var(--leaf)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--on-light);flex:none}
.map{height:170px;border-radius:22px;border:1px solid var(--leaf);background:var(--surface);overflow:hidden}
.washers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.washers>div{border:1px solid var(--leaf);border-radius:16px;padding:12px;text-align:center}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--leaf);display:grid;place-items:center}
.points{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1}
.points small{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:28px;color:var(--mint);margin-left:6px}

/* Banner de vista previa 2027 */
.preview{display:flex;gap:12px;align-items:flex-start;border:1px solid #556b2f;background:#16301f;border-radius:18px;padding:13px 14px;margin-bottom:16px;font-size:13px;line-height:1.45;color:var(--text)}
.preview b{color:var(--spark)}

/* Tutor */
.tutorbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--mint);color:var(--on-light);border-radius:16px;padding:10px 14px;margin-bottom:18px}
.tutorbar button{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;text-decoration:underline}
.nosee>div{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--leaf)}
.money{font-size:40px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* Hoja y toast */
.scrim{position:absolute;inset:0;background:rgba(3,10,9,.7);z-index:20;display:flex;align-items:flex-end}
@media (max-width:860px){.scrim{position:fixed}}
.sheet{width:100%;background:var(--pine);border-top:1px solid var(--leaf);border-radius:30px 30px 0 0;padding:14px 22px calc(26px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto;animation:up .25s ease}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--leaf);margin:0 auto 16px}
.sheet h3{margin:0 0 8px;font-size:22px}
.sheet p{color:var(--muted);line-height:1.5;margin:0 0 10px}
.toast{position:absolute;left:22px;right:22px;bottom:104px;background:var(--text);color:var(--on-light);border-radius:16px;padding:14px 16px;font-weight:600;z-index:30;display:flex;gap:10px;align-items:center;animation:up .25s ease}
@media (max-width:860px){.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom,0px))}}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,153,68,.45)}50%{box-shadow:0 0 0 16px rgba(255,153,68,0)}}
.pulse{animation:pulse 1.6s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- Versión móvil a pantalla completa ---- */
html,body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{padding-left:0;padding-right:0}
.stage{display:block;padding:0;margin:0 auto;max-width:none;height:100%}
.device{width:100%;max-width:480px;height:100%;margin:0 auto;border:0;border-radius:0;box-shadow:none}
@media (min-width:481px){.device{border-left:1px solid var(--leaf);border-right:1px solid var(--leaf)}}
.screen{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.screen.nonav{padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
.nav,.nav{position:absolute!important;left:max(12px,env(safe-area-inset-left,0px))!important;right:max(12px,env(safe-area-inset-right,0px))!important;bottom:calc(10px + env(safe-area-inset-bottom,0px))!important}
.toast{position:absolute!important;bottom:calc(100px + env(safe-area-inset-bottom,0px))!important}
.scrim{position:absolute!important}
.strip{margin:0 -18px;padding:0 18px}

   <button class="cta alert" data-act="sos-now">Enviar ahora</button></div>`;
  if(S.sos==='sent') return `${header('Protocolo // Emergencia','Alerta enviada',null,tag('p'))}
   <div class="card pulse" style="border-color:var(--alert);display:flex;gap:14px;align-items:center"><div class="ico" style="background:var(--alert);color:var(--on-light)">${ic('shield')}</div><div><div class="t1">Avisamos a tu red</div><div class="t2">${S.sosAt||nowHM()} · Cuarto ${S.room} · ${place()}</div></div></div>

    <div data-s="1"><span class="ck">${ic('check',14,2.5)}</span><div class="grow"><div class="t1">Concierge de guardia</div><div class="t2">Notificación + llamada</div></div></div>

   <button class="cta ghost" data-act="sos-close">Estoy bien, cerrar alerta</button>`;
  return `${header('Protocolo // Emergencia','Botón de pánico','inicio',tag('p'))}
  <div class="sos-wrap">
   <p class="sos-copy">Mantén presionado <b>3 segundos</b> para avisar a recepción, concierge y tus contactos.</p>

   <p class="note warn" style="text-align:left;margin-top:6px">No sustituye al 911. Si hay riesgo inmediato, llama al 911.</p>
  </div>`;
};

 <p class="note">Tarjeta, SPEI o efectivo en tienda. Factura automática si la pides.</p>`;

 <div class="mono" style="color:var(--muted)">${place()}</div>

 :`<div class="card" style="border-style:dashed"><div class="t2">Llega con los accesos del edificio WellCOMM, solo si Valeria lo autoriza.</div></div>`}
 <button class="cta ghost" data-go="noves">${ic('eyeoff',18)} Qué no puedo ver</button>`;

 ${header('Tutor // Privacidad','Lo que el tutor no ve',S.role==='tutor'?'tutor':'compartir',tag('p'))}
 <p class="t2" style="font-size:15px">Valeria es mayor de edad. Ella eligió qué compartir y puede cambiarlo. Te avisamos si lo hace.</p>
 <div class="lbl mono">Comparte contigo</div>
 <div class="nosee">${[['panic','Alertas de pánico'],['account','Estado de cuenta'],['access','Entradas y salidas'],['trip','Ubicación en modo viaje']].map(x=>`<div><span style="color:${S.share[x[0]]?'var(--mint)':'var(--faint)'}">${ic(S.share[x[0]]?'check':'x',20,2.2)}</span><div>${x[1]}${S.share[x[0]]?'':' <span class="t2">(no compartido)</span>'}</div></div>`).join('')}</div>
 <div class="lbl mono">Nunca ves</div>
 <div class="nosee">${['Sus mensajes, publicaciones y chats','Quién la visita y cuándo','Sus reportes, compras y reservas','Su ubicación fuera de una alerta o viaje'].map(x=>`<div><span style="color:var(--alert)">${ic('eyeoff',20)}</span><div>${x}</div></div>`).join('')}</div>`;

/* ---------- Hojas ---------- */
const SHEETS={
 arco:`<h3>Tus datos personales</h3><p>Puedes pedir acceso, corrección, cancelación u oposición al uso de tus datos (Derechos ARCO). Respondemos en máximo 20 días hábiles.</p><button class="cta" data-toast="Solicitud registrada. Folio ARCO-0031">Iniciar solicitud</button><button class="cta ghost" data-act="close">Ahora no</button>`,
 estancia:`<h3>Cuarto de visita</h3><p>Disponible en WellCOMM. Hasta 3 noches, máximo 2 personas. Se cobra en tu estado de cuenta.</p><div class="chips">${['Vie 20','Sáb 21','Dom 22'].map((d,i)=>`<button class="chip" aria-pressed="${i<2}">${d}</button>`).join('')}</div><button class="cta" data-toast="Solicitud enviada a recepción">Solicitar 2 noches · $900</button>`,
 pay:`<h3>Pagar $8,450</h3><p>Pago simulado. En la app real eliges tarjeta guardada, SPEI o efectivo en tienda.</p><div class="rows"><div><div class="ico">${ic('card')}</div><div class="grow"><div class="t1">Tarjeta terminación 0000</div><div class="t2">Ejemplo</div></div><span class="badge mint">Elegida</span></div></div><button class="cta" data-toast="Pago simulado recibido. Te enviamos tu comprobante.">Confirmar pago</button>`,
 dir:`<h3>Directorio</h3><p>Solo aparecen quienes eligieron ser visibles.</p><div class="rows">${[['Sofía P.','B-210 · Medicina'],['Jorge R.','A-105 · Arquitectura'],['Recepción','24 h · extensión 100'],['Concierge','8:00–23:00']].map(r=>`<div><div class="grow"><div class="t1">${r[0]}</div><div class="t2">${r[1]}</div></div></div>`).join('')}</div>`
};

const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const greeting=()=>{const h=new Date().getHours();return h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';};
const todayLbl=()=>{try{return new Intl.DateTimeFormat('es-MX',{weekday:'short',day:'numeric',month:'short'}).format(new Date()).replace(/\./g,'');}catch(e){return '';}};
['comunidad','amenidades','eventos','muro','cafeteria','servicios','puntos','llave','viaje','rostro','pagos','tutor','noves'].forEach(k=>delete V[k]);
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
setInterval(()=>{
  const t=S.tickets.find(x=>x.auto&&x.st<3); if(!t) return;
  t.st++; if(t.st>=3) t.auto=false;
  if(['ticket','reportes'].includes(current)) render();
  toast('Reporte '+t.id+': '+ST[t.st]);
},9000);

/* ---------- Render ---------- */
const $=s=>document.querySelector(s);
const screenEl=$('#screen'), navEl=$('#nav'), overlay=$('#overlay');
let current='alta', currentId=null;

function navHtml(){
  if(current==='alta'||(current==='sos'&&S.sos!=='idle')) return '';
  const items=[['inicio','home','Inicio'],['reportes','wrench','Reportes'],['visitas','users','Visitas'],['perfil','user','Perfil']];
  const map={avisos:'inicio',reportar:'reportes',ticket:'reportes',invitar:'visitas',pase:'visitas',paquetes:'inicio',compartir:'perfil',rostro:'perfil',pagos:'perfil',sos:'inicio'};
  const on=map[current]||(items.some(i=>i[0]===current)?current:'inicio');
  return items.map(i=>`<button data-go="${i[0]}" class="${on===i[0]?'on':''}" aria-label="${i[2]}">${ic(i[1],22)}<span>${i[2]}</span></button>`).join('');
}
function idxHtml(){
  const groups={};
  Object.entries(SCREENS).forEach(([k,v])=>{if(v.hide)return;(groups[v.g]=groups[v.g]||[]).push([k,v]);});
  return Object.entries(groups).map(([g,list])=>`<div><h3 class="mono">${g}</h3><ul>${list.map(([k,v])=>`<li><a href="#${k}" class="${current===k?'on':''}">${v.t}</a></li>`).join('')}</ul></div>`).join('');
}
function render(){
  clearTimers();
  const fn=V[current]||V.inicio;
  screenEl.innerHTML=fn(currentId);
  const nav=navHtml();
  navEl.innerHTML=nav; navEl.hidden=!nav;
  screenEl.classList.toggle('nonav',!nav);
  document.querySelectorAll('[data-act="mode"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.mode));
  document.querySelectorAll('[data-act="role"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.role));
  if(current==='pase') drawQR();
  if(current==='sos') sosEffects();
  bindHolds();
}
function go(name,id){
  if(!V[name]) name='inicio';
  if(name!=='sos'&&S.sos!=='idle'&&S.sos!=='sent') S.sos='idle';
  if(name!=='llave') S.opened=false;
  current=name; currentId=id||null; overlay.innerHTML='';
  if(name==='inicio') lsSet('wc_onboarded','1');
  if(location.hash.slice(1)!==name){location.hash=name;}
  render(); screenEl.scrollTop=0;
}

/* ---------- Efectos ---------- */
function sosEffects(){
  if(S.sos==='confirm'){
    let n=5; const tick=()=>{const c=$('#count'); if(!c) return; n--; if(n<=0){S.sos='sent';S.sosAt=nowHM();render();return;} c.textContent=n; later(tick,1000);};
    later(tick,1000);
  }
  if(S.sos==='sent'){
    const steps=[...document.querySelectorAll('#sosSteps>div')];
    steps.forEach((el,i)=>later(()=>el.classList.add('done'),500+i*700));
    later(()=>{const a=$('#attended'); if(a) a.innerHTML=`<div class="attended"><div class="mono" style="color:var(--mint)">Atendida · ${nowHM()}</div><div class="t1" style="margin-top:4px">Luis (front desk) va a tu cuarto</div><div class="t2">Llega en 2 min. Mantente donde estás si es seguro.</div></div>`;},3600);
  }
}
let holdRaf=null;
function bindHolds(){
  document.querySelectorAll('[data-hold]').forEach(el=>{
    const dur=el.dataset.hold==='sos'?3000:1200; let t0=0;
    const stop=()=>{cancelAnimationFrame(holdRaf); el.style.setProperty('--p',0);};
    const step=now=>{const p=Math.min(1,(now-t0)/dur); el.style.setProperty('--p',p);
      if(p>=1){ if(el.dataset.hold==='sos'){S.sos='confirm';render();} else {S.opened=true;render();later(()=>{if(current==='llave'){S.opened=false;render();}},5000);} return;}
      holdRaf=requestAnimationFrame(step);};
    const start=e=>{e.preventDefault(); t0=performance.now(); holdRaf=requestAnimationFrame(step);};
    el.addEventListener('pointerdown',start);
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop));
    el.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat) start(e);});
    el.addEventListener('keyup',stop);
    el.addEventListener('contextmenu',e=>e.preventDefault());
  });
}
function drawQR(){
  const c=$('#qr'); if(!c) return; const x=c.getContext('2d'); const N=29;
  let seed=[...(S.guest.name+S.guest.win)].reduce((a,ch)=>a*31+ch.charCodeAt(0)>>>0,7);
  const rnd=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;
  x.fillStyle='#EEF6EF'; x.fillRect(0,0,N,N); x.fillStyle='#0A211F';
  for(let i=0;i<N;i++)for(let j=0;j<N;j++) if(rnd()>.52) x.fillRect(i,j,1,1);
  const finder=(a,b)=>{x.fillStyle='#EEF6EF';x.fillRect(a-1,b-1,9,9);x.fillStyle='#0A211F';x.fillRect(a,b,7,7);x.fillStyle='#EEF6EF';x.fillRect(a+1,b+1,5,5);x.fillStyle='#0A211F';x.fillRect(a+2,b+2,3,3);};
  finder(1,1);finder(N-8,1);finder(1,N-8);
}
let toastT=null;
function toast(msg){
  const old=document.querySelector('.toast'); if(old) old.remove();
  const d=document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.innerHTML=ic('check',20,2.4)+'<span>'+msg+'</span>';
  document.querySelector('.device').appendChild(d); clearTimeout(toastT); toastT=setTimeout(()=>d.remove(),2600);
}
function sheet(key){
  overlay.innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${SHEETS[key]||''}</div></div>`;
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(a){e.preventDefault(); go(a.getAttribute('href').slice(1)); return;}
  const el=e.target.closest('[data-go],[data-act],[data-draft],[data-guest],[data-share],[data-slot],[data-cart],[data-door],[data-toast]');
  if(!el) return;
  if(el.classList.contains('scrim')&&e.target!==el) return; // clic en zona no interactiva de la hoja
  if(el.dataset.act==='close'){overlay.innerHTML='';return;}
  if(el.dataset.toast){toast(el.dataset.toast); if(el.closest('.sheet')) overlay.innerHTML=''; return;}
  if(el.dataset.go){go(el.dataset.go,el.dataset.id);return;}
  if(el.dataset.draft){S.draft.desc=($('#descIn')||{}).value||S.draft.desc;S.draft[el.dataset.draft]=el.dataset.v;render();return;}
  if(el.dataset.guest){saveGuest();S.guest[el.dataset.guest]=el.dataset.v;render();return;}
  if(el.dataset.share){if(el.disabled)return;const k=el.dataset.share;S.share[k]=!S.share[k];render();toast(S.share[k]?'Tu papá recibirá esto. Le avisamos del cambio.':'Dejaste de compartir esto.');return;}
  if(el.dataset.slot){S.slot=el.dataset.slot;render();return;}
  if(el.dataset.cart){const k=el.dataset.cart;S.cart[k]=Math.max(0,(S.cart[k]||0)+Number(el.dataset.d));render();return;}
  if(el.dataset.door){S.door=el.dataset.door;S.opened=false;render();return;}
  const act=el.dataset.act;
  switch(act){
    case 'panel': $('#panel').classList.toggle('open'); break;
    case 'mode': S.mode=el.dataset.v; render(); break;
    case 'mode-toggle': S.mode=isW()?'piloto':'wellcomm'; render(); toast(isW()?'Viendo WellCOMM 2027 · app en tiendas':'Viendo el piloto · edificio actual'); break;
    case 'role': if(el.dataset.v==='tutor') go('tutor'); else {S.role='res'; go('inicio');} break;
    case 'role-set': if(el.dataset.v==='tutor') go('tutor'); else {S.role='res'; go('perfil');} break;
    case 'submit-ticket':{
      S.draft.desc=($('#descIn')||{}).value||'';
      const id='T-0'+(149+S.tickets.length);
      S.tickets.unshift({id,cat:S.draft.cat,title:S.draft.desc||(S.draft.cat+' · '+S.draft.loc),loc:S.draft.loc,st:0,who:'Memo · mantenimiento',when:'Hoy '+nowHM(),rated:0,auto:true});
      S.draft={cat:'Plomería',loc:'Mi cuarto · '+S.room,urg:'Puede esperar',photo:null,desc:''};
      go('ticket',id); toast('Reporte '+id+' enviado al gerente'); break;}
    case 'advance':{const t=S.tickets.find(x=>x.id===el.dataset.id); if(t&&t.st<3){t.st++; render(); toast('Estado: '+ST[t.st]);} break;}
    case 'rate':{const t=S.tickets.find(x=>x.id===el.dataset.id); if(t){t.rated=Number(el.dataset.v); render();} break;}
    case 'sos-cancel': S.sos='idle'; render(); toast('Alerta cancelada. No se envió nada.'); break;
    case 'sos-now': S.sos='sent'; S.sosAt=nowHM(); render(); break;
    case 'logout': lsSet('wc_onboarded',''); go('alta'); break;
    case 'sos-close': S.sos='idle'; go('inicio'); toast('Alerta cerrada. Avisamos que estás bien.'); break;
    case 'visit': S.pending=false; render(); toast(el.dataset.v==='si'?'Recepción deja pasar a Diego':'Recepción le avisa que no puedes recibirlo'); break;
    case 'car': saveGuest(); S.guest.car=!S.guest.car; render(); break;
    case 'send-guest': saveGuest(); go('pase'); toast('Pase enviado a '+S.guest.name); break;
    case 'cancel-pass': go('visitas'); toast('Pase cancelado'); break;
    case 'book': if(S.slot){toast('Reservaste la sala de estudio a las '+S.slot); S.slot=null; render();} break;
    case 'order': S.cart={}; render(); toast('Pedido pagado. Listo en 10 min en el coffee bar.'); break;
    case 'trip': S.trip=!S.trip; render(); toast(S.trip?'Modo viaje activado. Se apaga al llegar.':'Modo viaje desactivado'); break;
    case 'sheet': sheet(el.dataset.v); break;
  }
});
function saveGuest(){const n=$('#gName'),p=$('#gPhone'); if(n) S.guest.name=n.value||S.guest.name; if(p) S.guest.phone=p.value||S.guest.phone;}
document.addEventListener('change',e=>{
  if(e.target.id==='photoIn'&&e.target.files[0]){
    const r=new FileReader(); r.onload=()=>{S.draft.desc=($('#descIn')||{}).value||S.draft.desc;S.draft.photo=r.result;render();}; r.readAsDataURL(e.target.files[0]);
  }
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1); if(h&&h!==current) go(h);});
const start=location.hash.slice(1);
current=V[start]?start:(lsGet('wc_onboarded')?'inicio':'alta');
render();
})();
</script>
